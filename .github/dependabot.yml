version: 2
updates:
  # Content packages have a very small dep surface — @datasworn-community core
  # + build-tools plus the ruleset packages they consume as dependencies.
  # Group them together so new schema-line publishes don't spawn N split PRs.
  # Use the `bun` ecosystem (not `npm`) so Dependabot updates bun.lock as part
  # of the PR. With `npm`, only package.json was updated and every Dependabot
  # PR failed CI on `bun install --frozen-lockfile` until someone regenerated
  # the lockfile by hand.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      datasworn-community:
        patterns:
          - "@datasworn-community/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
