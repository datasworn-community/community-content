          On a __weak hit__, you press on.

          On a __miss__, it's worse than you thought. Suffer an additional -1 radiation or [Lose Momentum](datasworn:move:revenant/suffer/lose_momentum) (-2). If your radiation is 0, you must also mark the __irradiated__ impact.
