  recover:
    name: Recover Moves
    type: move_category
    color: '#488B44'
    summary: __Recover moves__ are for resting and recuperating.
    description: |-
      When your resources are strained, your endurance and morale are ebbing, and your equipment and vehicles in disrepair, you'll need to find relief from the constant hardships of the world.

      Make these __recover moves__ when you attempt to rest, recover, or restock.
    _source:
      <<: *Source
      page: 180
    contents:
      sojourn:
        name: Sojourn
        roll_type: action_roll
        type: move
        trigger:
          text: When you spend time recovering within a community...
          conditions:
            - method: player_choice
              roll_options:
                - using: stat
                  stat: heart
        text: |-
          __When you spend time recovering within a community__, roll +heart.

          On a __strong hit__, this is a safe refuge. You and your allies may each choose two recover moves: [Heal](datasworn:move:revenant/recover/heal), [Hearten](datasworn:move:revenant/recover/hearten), [Repair](datasworn:move:revenant/recover/repair), or [Resupply](datasworn:move:revenant/recover/resupply). Instead of rolling, assume an automatic strong hit for each. An individual move can be taken more than once. If you use the __Radiation__ meter, take +1 radiation additionally.

          On a __weak hit__, as above, but time is short or resources are strained. You and your allies each make one recover move instead of two, with no more than three moves total among the group.

          On a __miss__, choose one.

            * The community needs your help, or makes a costly demand in exchange for your safety. Envision what they ask of you. If you do it, or [Make a Plan](datasworn:move:revenant/plan/make_a_plan) to see it done, resolve this move as a strong hit.
            * You find no relief, and the situation grows worse. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: |-
              On a __strong hit__, this is a safe refuge. You and your allies may each choose two recover moves: [Heal](datasworn:move:revenant/recover/heal), [Hearten](datasworn:move:revenant/recover/hearten), [Repair](datasworn:move:revenant/recover/repair), or [Resupply](datasworn:move:revenant/recover/resupply). Instead of rolling, assume an automatic strong hit for each. An individual move can be taken more than once. If you use the __Radiation__ meter, take +1 radiation additionally.
          weak_hit:
            text: |-
              On a __weak hit__, this is a safe refuge, but time is short or resources are strained. You and your allies may each make one recover move (with no more than three moves total among the group): [Heal](datasworn:move:revenant/recover/heal), [Hearten](datasworn:move:revenant/recover/hearten), [Repair](datasworn:move:revenant/recover/repair), or [Resupply](datasworn:move:revenant/recover/resupply). Instead of rolling, assume an automatic strong hit for each. An individual move can be taken more than once.
          miss:
            text: |-
              On a __miss__, choose one.

                * The community needs your help, or makes a costly demand in exchange for your safety. Envision what they ask of you. If you do it, or [Make a Plan](datasworn:move:revenant/plan/make_a_plan) to see it done, resolve this move as a strong hit.
                * You find no relief, and the situation grows worse. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 182
      heal:
        name: Heal
        roll_type: action_roll
        type: move
        trigger:
          text: When you receive medical care or provide treatment...
          conditions:
            - method: player_choice
              text: Receive treatment from someone (not an ally)
              roll_options:
                - using: stat
                  stat: iron
            - text: Care for yourself
              method: lowest
              roll_options:
                - using: stat
                  stat: iron
                - using: condition_meter
                  condition_meter: supply
            - text: Provide care
              method: lowest
              roll_options:
                - using: stat
                  stat: wits
                - using: condition_meter
                  condition_meter: supply
            - text: Obtain treatment for a companion
              method: player_choice
              roll_options:
                - using: stat
                  stat: heart
        text: |-
          __When you receive medical care or provide treatment__, envision the situation and roll. If you...

            * Receive treatment from someone (not an ally): Roll +iron
            * Care for yourself: Roll +iron or +supply, whichever is lower
            * Provide care: Roll +wits or +supply, whichever is lower
            * Obtain treatment for a companion: Roll +heart

          On a __strong hit__, the care is helpful. If you (or the ally under your care) are wounded, clear the impact and take or give +2 endurance. Otherwise, take or give +3 endurance.

          On a __weak hit__, as above, but the recovery expends medicine or medical treatment. [Sacrifice Resources](datasworn:move:revenant/suffer/sacrifice_resources) (-1).

          On a __miss__, the aid is ineffective and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: On a __strong hit__, the care is helpful. If you (or the ally under your care) are wounded, clear the impact and take or give +2 endurance. Otherwise, take or give +3 endurance.
          weak_hit:
            text: |-
              On a __weak hit__, the care is helpful. If you (or the ally under your care) are wounded, clear the impact and take or give +2 endurance. Otherwise, take or give +3 endurance.

              However, the recovery expends medicine or medical treatment. [Sacrifice Resources](datasworn:move:revenant/suffer/sacrifice_resources) (-1).
          miss:
            text: On a __miss__, the aid is ineffective and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 184
      hearten:
        name: Hearten
        roll_type: action_roll
        type: move
        trigger:
          text: When you socialize, share intimacy, or find a moment of peace...
          conditions:
            - method: player_choice
              roll_options:
                - using: stat
                  stat: heart
        text: |-
          __When you socialize, share intimacy, or find a moment of peace__, roll +heart. If you do so in the presence of a connection, add +1. If you share a bond, add +2 instead.

          On a __strong hit__, you find companionship or comfort and your spirit is strengthened. If you are shaken, clear the impact and take +1 morale. Otherwise, take +2 morale. If you make this move as you [Sojourn](datasworn:move:revenant/recover/sojourn), take +1 more.

          On a __weak hit__, as above, but this respite is fleeting. Envision an interruption, complication, or inner conflict. Then, [Lose Momentum](datasworn:move:revenant/suffer/lose_momentum) (-1).

          On a __miss__, you take no comfort and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: On a __strong hit__, you find companionship or comfort and your spirit is strengthened. If you are shaken, clear the impact and take +1 morale. Otherwise, take +2 morale. If you make this move as you [Sojourn](datasworn:move:revenant/recover/sojourn), take +1 more.
          weak_hit:
            text: |-
              On a __weak hit__, you find companionship or comfort and your spirit is strengthened. If you are shaken, clear the impact and take +1 morale. Otherwise, take +2 morale. If you make this move as you [Sojourn](datasworn:move:revenant/recover/sojourn), take +1 more.

              However, this respite is fleeting. Envision an interruption, complication, or inner conflict. Then, [Lose Momentum](datasworn:move:revenant/suffer/lose_momentum) (-1).
          miss:
            text: On a __miss__, you take no comfort and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 185
      resupply:
        name: Resupply
        roll_type: action_roll
        type: move
        trigger:
          text: When you attempt to bolster your readiness...
          conditions:
            - method: player_choice
              text: Barter or make an appeal
              roll_options:
                - using: stat
                  stat: heart
            - method: player_choice
              text: Scavenge or craft
              roll_options:
                - using: stat
                  stat: wits
            - method: player_choice
              text: Threaten or seize
              roll_options:
                - using: stat
                  stat: iron
            - method: player_choice
              text: Steal or swindle
              roll_options:
                - using: stat
                  stat: dark
        text: |-
          __When you attempt to bolster your readiness__, envision the opportunity and your approach. If you...

            * Barter or make an appeal: Roll +heart
            * Scavenge or craft: Roll +wits
            * Threaten or seize: Roll +iron
            * Steal or swindle: Roll +dark

          On a __strong hit__, choose one.

            * If you are unprepared, clear the impact and take +1 supply. Otherwise, take +2 supply.
            * If you are in need of a specific item or resource that can reasonably be obtained, you acquire it. Take +1 momentum.

          On a __weak hit__, as above, but you must first deal with a cost, complication, or demand. Envision the nature of this obstacle.

          On a __miss__, you encounter an unexpected peril. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: |-
              On a __strong hit__, choose one.

                * If you are unprepared, clear the impact and take +1 supply. Otherwise, take +2 supply.
                * If you are in need of a specific item or resource that can reasonably be obtained, you acquire it. Take +1 momentum.
          weak_hit:
            text: |-
              On a __weak hit__, you must first deal with a cost, complication, or demand. Envision the nature of this obstacle.

              Then choose one.

                * If you are unprepared, clear the impact and take +1 supply. Otherwise, take +2 supply.
                * If you are in need of a specific item or resource that can reasonably be obtained, you acquire it. Take +1 momentum.
          miss:
            text: On a __miss__, you encounter an unexpected peril. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 186
      repair:
        name: Repair
        roll_type: action_roll
        type: move
        trigger:
          text: When you make repairs to your vehicles or other mechanical devices...
          conditions:
            - method: highest
              text: Make your own repairs, or direct a companion to make repairs
              roll_options:
                - using: condition_meter
                  condition_meter: supply
                - using: stat
                  stat: wits
            - method: player_choice
              text: Obtain repairs from someone (not an ally)
              roll_options:
                - using: condition_meter
                  condition_meter: supply
        text: |-
          __When you make repairs to your vehicles or other mechanical devices__, envision the situation and roll. If you...

            * Make your own repairs, or aid a connection to make repairs: Roll +supply or +wits, whichever is higher.
            * Obtain repairs from someone (not an ally): Roll +supply

          On a __hit__, you gain repair points as appropriate to the situation, per the table below. Additionally, you may [Sacrifice Resources](datasworn:move:revenant/suffer/sacrifice_resources) and exchange each -1 of your supply for 1 extra repair point (up to 3 points).

          Situation     | Strong Hit | Weak Hit
          --------------|------------|---------
          At a facility | 5 points   | 3 points
          In the field  | 3 points   | 1 points
          Under fire    | 2 points   | 0 points

          Spend repair points as follows. Unused points are discarded.

            * Clear the battered impact on a vehicle: 2 points
            * Take +1 integrity on a vehicle: 1 point
            * Install or repair a vehicle upgrade: 3 points
            * Repair any other device: 3 points
            * Repair any other device, but with a complication or malfunction: 2 points

          On a __miss__, the repairs are not made and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: |-
              On a __strong hit__, you gain repair points as appropriate to the situation, per the table below.

              Situation     | Strong Hit
              --------------|-----------
              At a facility | 5 points
              In the field  | 3 points
              Under fire    | 2 points

              Additionally, you may [Sacrifice Resources](datasworn:move:revenant/suffer/sacrifice_resources) and exchange each -1 of your supply for 1 extra repair point (up to 3 points).

              Spend repair points as follows. Unused points are discarded.

                * Clear the battered impact on a vehicle: 2 points
                * Fix one broken module: 2 points
                * Take +1 integrity on a vehicle: 1 point
                * Take +1 endurance for a mechanical companion: 1 point
                * Repair any other device: 3 points
                * Repair any other device, but with a complication or malfunction: 2 points
          weak_hit:
            text: |-
              On a __weak hit__, you gain repair points as appropriate to the situation, per the table below.

              Situation     | Weak Hit
              --------------|---------
              At a facility | 3 points
              In the field  | 1 points
              Under fire    | 0 points

              Additionally, you may [Sacrifice Resources](datasworn:move:revenant/suffer/sacrifice_resources) and exchange each -1 of your supply for 1 extra repair point (up to 3 points).

              Spend repair points as follows. Unused points are discarded.

                * Clear the battered impact on a vehicle: 2 points
                * Fix one broken module: 2 points
                * Take +1 integrity on a vehicle: 1 point
                * Take +1 endurance for a mechanical companion: 1 point
                * Repair any other device: 3 points
                * Repair any other device, but with a complication or malfunction: 2 points
          miss:
            text: On a __miss__, the repairs are not made and the situation worsens. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 190
  legacy:
    name: Legacy Moves
    type: move_category
    color: '#4F5A69'
    _source:
      <<: *Source
      page: 194
    summary: |-
      __Legacy moves__ are used when improving your character, or when you take up a character's mantle upon their retirement.
    description:
      The three legacy tracks—plans, bonds, and discoveries—are a special type of progress track to show the evolution of your character. As you complete plans, build relationships, and explore the world, you'll mark progress on these tracks and gain experience. This experience is then spent on talents or stat increases to represent your character's growing skills.

      Make these __Legacy Moves__ to gain and spend experience, and when you face a final test to learn how your accomplishments and failures will echo through time.
    contents:
      earn_experience:
        name: Earn Experience
        roll_type: no_roll
        type: move
        trigger:
          text: When you fill a box (four ticks) on any legacy track...
        text: |-
          __When you fill a box (four ticks) on any legacy track__, take 2 experience. This experience may be spent when you [Advance](datasworn:move:revenant/legacy/advance).

          Once you completely fill the tenth box on any legacy track, clear that track. You may start again marking progress on the cleared track, but earn experience at a reduced rate of 1 experience (instead of 2) for each filled progress box. If you make a progress roll against this track, resolve the outcome as if at 10 progress.
        _source:
          <<: *Source
          page: 196
      advance:
        name: Advance
        roll_type: no_roll
        type: move
        trigger:
          text: When you develop your abilities...
        text: |-
          __When you develop your abilities__, you may bolster your personal capabilities as appropriate to your focus and opportunities.

          If you bolster your personal capabilities, spend 3 experience. Then, add a new talent.

          If you have completely filled the tenth box of any legacy track, you may instead spend 6 experience and increase one stat by +1, to a maximum of +4.
        _source:
          <<: *Source
          page: 197
      continue_a_legacy:
        name: Continue a Legacy
        roll_type: special_track
        type: move
        trigger:
          text: When you retire or succumb to death or desolation...
          conditions:
            - method: all
              roll_options:
                - using: plans_legacy
                - using: bonds_legacy
                - using: discoveries_legacy
        text: |-
          __When you retire or succumb to death or desolation__, you may create a new character in your established setting or have a connection [Rise to the Challenge](datasworn:move:revenant/connection/rise_to_the_challenge). If you do, roll the challenge dice and compare to each of the former character's legacy tracks: quests, bonds, and discoveries (one roll per track).

          For each __strong hit__, choose one from below, or one from the weak hit or miss options.

            * Follow their path: Gain one talent from the former character (at no cost).
            * Share a connection: Take one connection from the former character, including any accrued progress or bond benefits.
            * Take the wheel: Gain one vehicle from the former character.

          For each __weak hit__, choose one from below, or one from the miss options.

            * See it through: Choose one of the former character's unfinished plans that is not a shared plan. Then, [Make a Plan](datasworn:move:revenant/plan/make_a_plan) to see it done and assume an automatic strong hit. You may immediately mark up to half their earned progress (round down) on this plan.
            * Make an acquaintance: Name one of the former character's connections that is not a shared connection. Envision how time or circumstances have changed them in a dramatic way. When you [Make a Connection](datasworn:move:revenant/connection/make_a_connection) with them, take an automatic strong hit and mark two ticks on your bonds legacy track.
            * Explore familiar ground: Name a location that was meaningful to the former character. When you first visit that place, envision how it has changed or is endangered. Then, mark two ticks on your discoveries legacy track.

          For each __miss__, choose one.

            * Deal with the aftermath: Envision how one of your former character's foes has gained power or influence and [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis).
            * Switch loyalties: Envision how you begin in opposition to your former character's beliefs, goals, or allegiances.
            * Chaos: Envision how a discovery has unleashed unexpected consequences.
        outcomes:
          strong_hit:
            text: |-
              On a __strong hit__, choose one:

                * Follow their path: Gain one talent from the former character (at no cost).
                * Share a connection: Take one connection from the former character, including any accrued progress or bond benefits.
                * Take the wheel: Gain one vehicle from the former character.

              Alternatively, you may choose a weak hit option:

                * See it through: Choose one of the former character's unfinished plans that is not a shared plan. Then, [Make a Plan](datasworn:move:revenant/plan/make_a_plan) to see it done and assume an automatic strong hit. You may immediately mark up to half their earned progress (round down) on this plan.
                * Make an acquaintance: Name one of the former character's connections that is not a shared connection. Envision how time or circumstances have changed them in a dramatic way. When you [Make a Connection](datasworn:move:revenant/connection/make_a_connection) with them, take an automatic strong hit and mark two ticks on your bonds legacy track.
                * Explore familiar ground: Name a location that was meaningful to the former character. When you first visit that place, envision how it has changed or is endangered. Then, mark two ticks on your discoveries legacy track.

              Or a miss option:

                * Deal with the aftermath: Envision how one of your former character's foes has gained power or influence and [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis).
                * Switch loyalties: Envision how you begin in opposition to your former character's beliefs, goals, or allegiances.
                * Chaos: Envision how a discovery has unleashed unexpected consequences.
          weak_hit:
            text: |-
              On a __weak hit__, choose one:

                * See it through: Choose one of the former character's unfinished plans that is not a shared plan. Then, [Make a Plan](datasworn:move:revenant/plan/make_a_plan) to see it done and assume an automatic strong hit. You may immediately mark up to half their earned progress (round down) on this plan.
                * Make an acquaintance: Name one of the former character's connections that is not a shared connection. Envision how time or circumstances have changed them in a dramatic way. When you [Make a Connection](datasworn:move:revenant/connection/make_a_connection) with them, take an automatic strong hit and mark two ticks on your bonds legacy track.
                * Explore familiar ground: Name a location that was meaningful to the former character. When you first visit that place, envision how it has changed or is endangered. Then, mark two ticks on your discoveries legacy track.

              Alternatively, you may choose a miss option:

                * Deal with the aftermath: Envision how one of your former character's foes has gained power or influence and [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis).
                * Switch loyalties: Envision how you begin in opposition to your former character's beliefs, goals, or allegiances.
                * Chaos: Envision how a discovery has unleashed unexpected consequences.
          miss:
            text: |-
              On a __miss__, choose one:

                * Deal with the aftermath: Envision how one of your former character's foes has gained power or influence and [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis).
                * Switch loyalties: Envision how you begin in opposition to your former character's beliefs, goals, or allegiances.
                * Chaos: Envision how a discovery has unleashed unexpected consequences.
        _source:
          <<: *Source
          page: 198
  fate:
    name: Fate Moves
    type: move_category
    color: '#8F477B'
    summary: |-
      __Fate moves__ help you decide what happens in solo and co-op play, or support the GM's decisions and brainstorming in guided play
    description: |-
      In solo and co-op play, the __fate moves__ mediate the result of other moves or serve as inspirational prompts for your story. When you face the uncertain outcome of a move, want to know what happens next, or have a question about people, places, and events, these moves help reveal the answer.
    _source:
      <<: *Source
      page: 200
    contents:
      meet_with_disaster:
        name: Meet with Disaster
        roll_type: no_roll
        type: move
        trigger:
          text: When you suffer the outcome of an action...
        suggestions:
          - oracle_rollable:revenant/story/complication
          - oracle_rollable:*/**/hazard
        oracles:
          meet_with_disaster:
            name: Meet with Disaster
            oracle_type: table_text
            type: oracle_rollable
            rows:
              - roll: { min: 1, max: 2 }
                text: 'A trusted individual or community acts against you'
              - roll: { min: 3, max: 4 }
                text: 'An individual or community close to you is put in danger'
              - roll: { min: 5, max: 7 }
                text: 'You encounter signs of a looming threat'
              - roll: { min: 8, max: 10 }
                text: 'You create an opportunity for an enemy'
              - roll: { min: 11, max: 14 }
                text: 'You face a tough choice'
              - roll: { min: 15, max: 18 }
                text: 'You face the consequences of an earlier choice'
              - roll: { min: 19, max: 22 }
                text: 'A surprising development complicates your plan'
              - roll: { min: 23, max: 26 }
                text: 'You are separated from something or someone'
              - roll: { min: 27, max: 30 }
                text: 'A complication with a plan arises'
              - roll: { min: 31, max: 33 }
                text: 'You cause collateral damage or an unintended effect'
              - roll: { min: 34, max: 38 }
                text: 'Something of value is lost or destroyed'
              - roll: { min: 39, max: 44 }
                text: 'The environment or terrain introduces a new hazard'
              - roll: { min: 45, max: 50 }
                text: 'A new enemy is revealed'
              - roll: { min: 51, max: 56 }
                text: 'A companion or ally is in danger (or you are, if alone)'
              - roll: { min: 57, max: 62 }
                text: 'Your equipment or vehicle malfunctions'
              - roll: { min: 63, max: 68 }
                text: 'Your vehicle suffers damage'
              - roll: { min: 69, max: 74 }
                text: 'You waste resources'
              - roll: { min: 75, max: 81 }
                text: 'You are harmed'
              - roll: { min: 82, max: 88 }
                text: 'You are stressed'
              - roll: { min: 89, max: 95 }
                text: 'You are delayed or put at a disadvantage'
              - roll: { min: 96, max: 100 }
                text: 'Roll twice'
                oracle_rolls:
                  - number_of_rolls: 2
                    auto: true

        text: |-
          __When you suffer the outcome of an action__, choose one.

            * Make the most obvious negative outcome happen.
            * Make a suffer move. Or, if the failure was more dramatic, [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis).
            * [Seek Guidance](datasworn:move:revenant/fate/seek_guidance) for inspiration. Interpret the answer as a hardship or complication appropriate to the situation.
            * Roll on the table below. If the result doesn't fit the situation, roll again.

          {{table>move.oracle_rollable:revenant/fate/meet_with_disaster.meet_with_disaster}}
        _source:
          <<: *Source
          page: 202
      seek_guidance:
        name: Seek Guidance
        roll_type: no_roll
        type: move
        trigger:
          text: When you seek to resolve questions or reveal details...
        text: |-
          __When you seek to resolve questions or reveal details__, you may...

            * Draw a conclusion based on the most interesting, dramatic, or obvious result.
            * Spark an idea and decide the answer through using an Oracle table or other prompt.
            * Ask a yes/no question. Then, take your challenge dice and roll each die in turn. If the second die is higher than the first, the answer is 'yes'. If the first die is the greater, the answer is 'no'.

              Additionally, you may continue and receive a more nuanced answer. If both the numbers are high (6 or above) add the word 'and'. If the numbers are both low (5 or below), add the word 'but'.

              If you roll a match, make a choice. Either the question has taken something for granted that makes it impossible to answer 'yes' or 'no', or reroll both your dice then envision an extreme result.
        _source:
          <<: *Source
          page: 204
  scene_challenge:
    name: Scene Challenges
    type: move_category
    color: '#206087'
    summary: |-
      __Scene moves__ are for extended non-combat situations.
    description: |-
      A __scene challenge__ is a structured approach for resolving an extended non-combat scene against a threat or other characters, particularly when a time limit or looming danger adds extra urgency. Examples of a scene challenge include barricading a warehouse against an oncoming horde of zombies, participating in a debate, or competing in an off-road race.
    _source:
      <<: *Source
      page: 208
    contents:
      begin_the_scene:
        name: Begin the Scene
        roll_type: no_roll
        type: move
        trigger:
          text: When you face an extended or complex challenge...
        text: |-
          __When you face an extended or complex challenge__, name your objective and choose a rank as appropriate to the situation.

            * You have a clear advantage: Troublesome
            * You are ready to act: Dangerous
            * You are unprepared or outmatched: Formidable

          Then, activate a tension clock.
        _source:
          <<: *Source
          page: 210
      overcome_peril:
        name: Overcome Peril
        # variant_of: move:revenant/basic/defy_danger
        roll_type: action_roll
        type: move
        trigger:
          text: When you attempt something risky or react to an imminent threat within a scene challenge...
          conditions:
            - method: player_choice
              text: With finesse, mobility, or agility
              roll_options:
                - using: stat
                  stat: edge
            - method: player_choice
              text: With resolve, command, or sociability
              roll_options:
                - using: stat
                  stat: heart
            - method: player_choice
              text: With strength, endurance, or aggression
              roll_options:
                - using: stat
                  stat: iron
            - method: player_choice
              text: With deception, stealth, or betrayal
              roll_options:
                - using: stat
                  stat: dark
            - method: player_choice
              text: With expertise, focus, or observation
              roll_options:
                - using: stat
                  stat: wits
        text: |-
          __When you attempt something risky or react to an imminent threat within a scene challenge__, envision your action and roll. If you act...

            * With finesse, mobility, or agility: Roll +edge
            * With resolve, command, or sociability: Roll +heart
            * With strength, endurance, or aggression: Roll +iron
            * With deception, stealth, or betrayal: Roll +dark
            * With expertise, focus, or observation: Roll +wits

          On a __strong hit__, you are successful and mark progress. On a __strong hit with a match__, mark progress twice.

          On a __weak hit__, you are successful and mark progress, but also encounter a complication or setback. Envision what occurs and fill a clock segment.

          On a __miss__, you fail, or a momentary success is undermined by a dramatic turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) and fill a clock segment. On a __miss with a match__, fill two segments instead.
        outcomes:
          strong_hit:
            text: On a __strong hit__, you are successful and mark progress. On a __strong hit with a match__, mark progress twice.
          weak_hit:
            text: On a __weak hit__, you are successful and mark progress, but also encounter a complication or setback. Envision what occurs and fill a clock segment.
          miss:
            text: On a __miss__, you fail, or a momentary success is undermined by a dramatic turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) and fill a clock segment. On a __miss with a match__, fill two segments instead.
        _source:
          <<: *Source
          page: 212
      obtain_an_opportunity:
        name: Obtain an Opportunity
        # variant_of: move:revenant/basic/secure_an_advantage
        roll_type: action_roll
        type: move
        trigger:
          text: When you assess a situation, make preparations, or attempt to gain leverage within a scene challenge...
          conditions:
            - method: player_choice
              text: With finesse, mobility, or agility
              roll_options:
                - using: stat
                  stat: edge
            - method: player_choice
              text: With resolve, command, or sociability
              roll_options:
                - using: stat
                  stat: heart
            - method: player_choice
              text: With strength, endurance, or aggression
              roll_options:
                - using: stat
                  stat: iron
            - method: player_choice
              text: With deception, stealth, or betrayal
              roll_options:
                - using: stat
                  stat: dark
            - method: player_choice
              text: With expertise, focus, or observation
              roll_options:
                - using: stat
                  stat: wits
        text: |-
          __When you assess a situation, make preparations, or attempt to gain leverage within a scene challenge__, envision your action and roll. If you act...

            * With finesse, mobility, or agility: Roll +edge
            * With resolve, command, or sociability: Roll +heart
            * With strength, endurance, or aggression: Roll +iron
            * With deception, stealth, or betrayal: Roll +dark
            * With expertise, focus, or observation: Roll +wits

          On a __hit__, you are successful. On a __strong hit__, take both. On a __strong hit with a match__, take both and mark progress. On a __weak hit__, choose one.

            * Take +2 momentum
            * Add +1 on your next move (not a progress move)

          On a __miss__, you fail, or a momentary success is undermined by a dramatic turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) and fill a clock segment. On a __miss with a match__, fill two segments instead.
        outcomes:
          strong_hit:
            text: |-
              On a __strong hit__, you are successful. Take +2 momentum and add +1 on your next move (not a progress move).

               On a __strong hit with a match__, take both and mark progress.
          weak_hit:
            text: |-
              On a __weak hit__, you are successful. Choose one.

                * Take +2 momentum
                * Add +1 on your next move (not a progress move)
          miss:
            text: |-
              On a __miss__, you fail, or a momentary success is undermined by a dramatic turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) and fill a clock segment. On a __miss with a match__, fill two segments instead.
        _source:
          <<: *Source
          page: 213
      finish_the_scene:
        name: Finish the Scene
        roll_type: progress_roll
        type: move
        tracks:
          category: Scene Challenge
        trigger:
          text: When the scene challenge tension clock or progress track is filled, or when events lead to the scene's conclusion...
          conditions:
            - roll_options:
                - using: progress_track
        text: |-
          __When the scene challenge tension clock or progress track is filled, or when events lead to the scene's conclusion__, roll the challenge dice and compare to your progress.

          On a __strong hit__, you achieve your objective unconditionally.

          On a __weak hit__, you succeed, but not without cost. You must [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) but, you can make this a minor cost relative to the scope of the scene.

          On a __miss__, you fail or are undermined by a dire and costly turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        outcomes:
          strong_hit:
            text: On a __strong hit__, you achieve your objective unconditionally.
          weak_hit:
            text: On a __weak hit__, you succeed, but not without cost. You must [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster) but, you can make this a minor cost relative to the scope of the scene.
          miss:
            text: On a __miss__, you fail, or are undermined by a dramatic and costly turn of events. [Meet with Disaster](datasworn:move:revenant/fate/meet_with_disaster).
        _source:
          <<: *Source
          page: 214
