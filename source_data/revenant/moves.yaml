                  condition_meter: radiation
        text: |-
          __When you are exposed to unsafe levels of radiation__, suffer -1 radiation for minor contamination, -2 for serious contamination, or -3 for terrible contamination. If your radiation is 0, [Lose Momentum](datasworn:move:revenant/suffer/lose_momentum) equal to any remaining contamination.

          Then, if your radiation is at 0 or you choose to resist the contamination, roll +radiation.

