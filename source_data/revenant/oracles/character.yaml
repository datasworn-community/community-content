    # Aliases: [NPC]
    summary: |-
      Use these oracles when you encounter new NPCs or if you want further inspiration when you create your own character.
    contents:
      name:
        name: Character Name
        summary: |-
          The name of a character might be the first or last detail revealed. You may only know a person's name and begin an arduous hunt to find them or, you might meet a lone traveller in the wasteland and only after revealing other details of the encounter would you learn their name.
