                    text: Stonewall
                  - roll: { min: 71, max: 80 }
                    text: The Underground
                  - roll: { min: 81, max: 90 }
                    text: Timbermill
                  - roll: { min: 91, max: 100 }
                    text: Trenchwatch
              animal:
                name: Animal
                summary: |-
                  An animal. Why have the people of this enclave chosen this animal?
                oracle_type: column_text
                type: oracle_rollable
                _source:
                  <<: *Source
                  page: 292
                rows:
                  - roll: { min: 1, max: 10 }
                    text: Anaconda Falls
                  - roll: { min: 11, max: 20 }
                    text: "'Gator"
                  - roll: { min: 21, max: 30 }
                    text: Bearskin
                  - roll: { min: 31, max: 40 }
                    text: "Cougar' Caverns"
                  - roll: { min: 41, max: 50 }
