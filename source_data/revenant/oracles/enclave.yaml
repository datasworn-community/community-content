_id: revenant
datasworn_version: "0.1.0"
type: ruleset
oracles:
  enclave:
    name: Enclave Oracles
    canonical_name: Enclaves
    type: oracle_collection
    oracle_type: tables
    _source:
      <<: &Source
        title: 'Revenant'
        license: https://creativecommons.org/licenses/by-sa/4.0
        url: https://www.drivethrurpg.com/en/product/457762/revenant
        date: 2025-06-23
        authors:
          - name: Killian Gillespie
      page: 290
    summary: |-
      An enclave is any location that people inhabit the wasteland. There are no specific entries in the Location oracles to tell you if you have come across an enclave. This is to ensure that the population level in Revenant is left up to you.
    collections:
      name:
        name: Enclave Name
        summary: |-
          Use this oracle to generate a name for a place you have discovered or a location to which you need to travel. Roll your array dice once for the category and then roll your oracle dice for the name. Alternatively, you could come up with a name that fits the theme.
        oracle_type: tables
        type: oracle_collection
        _source:
          <<: *Source
          page: 292
        contents:
          category:
            name: Enclave Name Category
            oracle_type: table_text
            type: oracle_rollable
            dice: 1d6
            _source:
              <<: *Source
              page: 292
            rows:
              - roll: { min: 1, max: 1 }
                text: "[Landscape](datasworn:oracle_rollable:revenant/enclave/name/category/landscape)"
              - roll: { min: 2, max: 2 }
                text: "[Manmade creation](datasworn:oracle_rollable:revenant/enclave/name/category/manmade)"
              - roll: { min: 3, max: 3 }
                text: "[Animal](datasworn:oracle_rollable:revenant/enclave/name/category/animal)"
              - roll: { min: 4, max: 4 }
                text: "[Historical event](datasworn:oracle_rollable:revenant/enclave/name/category/historical)"
              - roll: { min: 5, max: 5 }
                text: "[Ominous or inspirational name](datasworn:oracle_rollable:revenant/enclave/name/category/ominous)"
              - roll: { min: 6, max: 6 }
                text: "[Seasonal or environmental aspect](datasworn:oracle_rollable:revenant/enclave/name/category/seasonal)"
        collections:
          category:
            name: Category
            type: oracle_collection
            oracle_type: table_shared_rolls
            _source:
              <<: *Source
              page: 292
            contents:
              landscape:
                name: Feature of the landscape
                summary: |-
                  A feature of the landscape. Envision what it is. What makes it unusual or distinctive?
                oracle_type: column_text
                type: oracle_rollable
                _source:
                  <<: *Source
                  page: 292
                rows:
                  - roll: { min: 1, max: 10 }
                    text: Clearwater
                  - roll: { min: 11, max: 20 }
                    text: Darkwood
                  - roll: { min: 21, max: 30 }
                    text: Edgedrop
                  - roll: { min: 31, max: 40 }
                    text: Grassfields
                  - roll: { min: 41, max: 50 }
                    text: Highway
                  - roll: { min: 51, max: 60 }
                    text: Limestone
                  - roll: { min: 61, max: 70 }
                    text: Marshlands
                  - roll: { min: 71, max: 80 }
                    text: Rock Hall
                  - roll: { min: 81, max: 90 }
                    text: Snowy Peak
                  - roll: { min: 91, max: 100 }
                    text: Trainstop
              manmade:
                name: Manmade creation
                summary: |-
                  A manmade creation. What is it? Why is it important to this enclave's history?
                oracle_type: column_text
                type: oracle_rollable
                _source:
                  <<: *Source
                  page: 292
                rows:
