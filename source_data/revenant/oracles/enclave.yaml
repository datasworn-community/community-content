              historical:
                name: Historical event
                summary: |-
                  A historical event. What happened here? What commemorates this event?
                oracle_type: column_text
                type: oracle_rollable
                _source:
                  <<: *Source
                  page: 293
                rows:
                  - roll: { min: 1, max: 10 }
