                    text: The Battlefield
                  - roll: { min: 81, max: 90 }
                    text: The Stand
                  - roll: { min: 91, max: 100 }
                    text: Victory
              ominous:
                name: Ominous or inspirational name
                summary: |-
                  An ominous or inspirational name. What grim event inspired this name or what motivation was required to overcome adversity here?
                oracle_type: column_text
                type: oracle_rollable
                _source:
                  <<: *Source
                  page: 293
                rows:
                  - roll: { min: 1, max: 10 }
                    text: Brave
                  - roll: { min: 11, max: 20 }
                    text: Broken
                  - roll: { min: 21, max: 30 }
                    text: Haven
                  - roll: { min: 31, max: 40 }
                    text: Ghosts
                  - roll: { min: 41, max: 50 }
                    text: Independence
                  - roll: { min: 51, max: 60 }
                    text: Murder
                  - roll: { min: 61, max: 70 }
                    text: Nowhere
