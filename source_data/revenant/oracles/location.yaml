_id: revenant
datasworn_version: "0.1.0"
type: ruleset
oracles:
  location:
    name: Location Oracles
    canonical_name: Locations
    oracle_type: tables
    type: oracle_collection
    _source:
      <<: &Source
        title: 'Revenant'
        license: https://creativecommons.org/licenses/by-sa/4.0
        url: https://www.drivethrurpg.com/en/product/457762/revenant
        date: 2025-06-23
        authors:
          - name: Killian Gillespie
      page: 300
    summary: |-
      Locations are places. The world around you, whatever state it's in. To create a location you will envision the area. You will determine the landscape, the hazards or the opportunities the location provides, and other features of the area.

      Each location on the following pages includes a set of oracles.
        * __Feature__: Use this oracle to reveal a new aspect of the location.
        * __Hazard__: Use this to oracle to help envision a complication or hazard.
        * __Opportunity__: Use this oracle to help envision a beneficial encounter or event, or when you roll a strong hit with a match.

      The location oracles are divided into territories and themes. A territory is an oracle to help you envision a biome or district. Themes help you envision the motif or atmosphere of a location.
    contents:
      territory:
        name: Territory
        summary: |-
          Use this oracle when you travel to a new biome or district, or to answer a question about where someone or something can be found.
        oracle_type: table_text
        type: oracle_rollable
        _source:
          <<: *Source
          page: 301
        rows:
          - roll: { min: 1, max: 6 }
            text: '[Badlands](datasworn:oracle_collection:revenant/location/territories/badlands)'
          - roll: { min: 7, max: 12 }
            text: '[Coastal](datasworn:oracle_collection:revenant/location/territories/coastal)'
          - roll: { min: 13, max: 19 }
            text: '[Commercial](datasworn:oracle_collection:revenant/location/territories/commercial)'
          - roll: { min: 20, max: 26 }
            text: '[Farmland](datasworn:oracle_collection:revenant/location/territories/farmland)'
          - roll: { min: 27, max: 32 }
            text: '[Industrial](datasworn:oracle_collection:revenant/location/territories/industrial)'
          - roll: { min: 33, max: 39 }
            text: '[Leisure](datasworn:oracle_collection:revenant/location/territories/leisure)'
          - roll: { min: 40, max: 46 }
            text: '[Medical](datasworn:oracle_collection:revenant/location/territories/medical)'
          - roll: { min: 47, max: 53 }
            text: '[Rainforest](datasworn:oracle_collection:revenant/location/territories/rainforest)'
          - roll: { min: 54, max: 60 }
            text: '[Residential](datasworn:oracle_collection:revenant/location/territories/residential)'
